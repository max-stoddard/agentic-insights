name: Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: Existing release tag to publish
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to publish, for example v0.2.1
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      TAG_NAME: ${{ inputs.tag_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Clear legacy npm auth config
        shell: bash
        run: npm config delete always-auth --location=user || true

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match packages/cli/package.json ($PACKAGE_VERSION)."
            exit 1
          fi
          if [ "$(git rev-list -n 1 "$TAG_NAME")" != "$(git rev-parse HEAD)" ]; then
            echo "Tag $TAG_NAME does not point at the checked-out release commit."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Run packed launcher smoke test
        run: npm run test:pack

      - name: Locate release notes
        id: release_notes
        shell: bash
        run: |
          RELEASE_NOTES_PATH=".github/release-notes/${TAG_NAME}.md"
          if [ ! -s "$RELEASE_NOTES_PATH" ]; then
            echo "Missing or empty release notes file: $RELEASE_NOTES_PATH"
            exit 1
          fi
          echo "path=$RELEASE_NOTES_PATH" >> "$GITHUB_OUTPUT"

      - name: Check npm publish status
        id: npm_status
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./packages/cli/package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package with automation token
        if: ${{ steps.npm_status.outputs.exists != 'true' && env.NPM_TOKEN != '' }}
        run: npm publish -w agentic-insights --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish npm package with trusted publishing
        if: ${{ steps.npm_status.outputs.exists != 'true' && env.NPM_TOKEN == '' }}
        run: npm publish -w agentic-insights --access public --provenance

      - name: Prepare GitHub Packages mirror
        run: node ./packages/cli/scripts/prepare-github-package.mjs

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@max-stoddard"

      - name: Check GitHub Packages publish status
        id: github_package_status
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "@max-stoddard/agentic-insights@${PACKAGE_VERSION}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Packages mirror
        if: ${{ steps.github_package_status.outputs.exists != 'true' }}
        run: npm publish ./packages/cli/.github-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          body_path: ${{ steps.release_notes.outputs.path }}
          generate_release_notes: true
